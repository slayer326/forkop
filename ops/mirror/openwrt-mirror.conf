server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/mirror/public;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
