name: Backend CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forkop/files/**'
      - 'forkop/Makefile'
      - 'build.sh'
      - 'install.sh'
      - 'ops/hosting/**'
      - 'ops/mirror/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'forkop/files/**'
      - 'forkop/Makefile'
      - 'build.sh'
      - 'install.sh'
      - 'ops/hosting/**'
      - 'ops/mirror/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-checks:
    name: Backend Runtime Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Build ucode
        shell: bash
        timeout-minutes: 10
        run: |
          missing=()
          command -v cc >/dev/null || missing+=(build-essential)
          command -v cmake >/dev/null || missing+=(cmake)
          command -v git >/dev/null || missing+=(git)
          command -v pkg-config >/dev/null || missing+=(pkg-config)
          pkg-config --exists json-c 2>/dev/null || missing+=(libjson-c-dev)
          if ((${#missing[@]})); then
            # The hosted runner's Azure mirror can stall indefinitely. Use the
            # primary Ubuntu archive and fail promptly if it is unavailable.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' |
                sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo timeout 180s apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
              install -y "${missing[@]}"
          fi
          git clone --depth 1 --branch v0.0.20250529 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig
          command -v ucode
          ucode -e 'print("ucode ready\n")'

      - name: Check ucode syntax
        shell: bash
        run: |
          find forkop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -c -o /dev/null
          find forkop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -S -c -o /dev/null

      - name: Test home mirror synchronization and retention
        shell: bash
        run: python3 -m unittest discover -s ops/mirror/home -p 'test_*.py' -v

      - name: Run backend tests
        shell: bash
        run: |
          failed=0
          for test_file in tests/*.sh; do
            printf 'Running %s\n' "$test_file"
            if output="$(bash "$test_file" 2>&1)"; then
              printf '%s\n' "$output"
              continue
            fi
            printf '%s\n' "$output"
            # Job logs need repository access; annotations and the run summary
            # do not. Carry the failure reason into both.
            reason="$(printf '%s' "$output" | tail -n 20 | tr '\r\n' '  ' | sed 's/%/%25/g')"
            echo "::error file=$test_file::Backend regression failed: ${reason}"
            {
              printf '### %s\n\n```\n' "$test_file"
              printf '%s\n' "$output" | tail -n 40
              printf '```\n'
            } >>"$GITHUB_STEP_SUMMARY"
            failed=1
          done
          exit "$failed"
